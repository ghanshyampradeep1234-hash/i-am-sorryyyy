<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I am Sorry</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2326;--pink:#d9ccf5;--paper:#d6f0e4;--bg:#e4f1fb}
@media (prefers-color-scheme:dark){:root{--ink:#2a2326}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:'Gaegu','Comic Sans MS',cursive;color:var(--ink)}
.book{position:fixed;inset:0;perspective:1800px;background:#cfe3f5}
.page{position:absolute;inset:0;transform-origin:left center;transition:transform 1.1s cubic-bezier(.6,.05,.3,1);backface-visibility:hidden;-webkit-backface-visibility:hidden;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);padding:20px;overflow:hidden;
background:
url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><text x='20' y='40' font-size='16' fill='%23a98be8'>♥</text><text x='100' y='70' font-size='14' fill='%2370c2b0'>♥</text><text x='50' y='120' font-size='14' fill='%2370c2b0'>♥</text><text x='125' y='145' font-size='16' fill='%23a98be8'>♥</text></svg>"),
repeating-linear-gradient(90deg,rgba(150,200,240,.45) 0 40px,transparent 40px 80px),repeating-linear-gradient(0deg,rgba(150,200,240,.45) 0 40px,transparent 40px 80px),#f7fbff}
.page.flipped{transform:rotateY(-180deg);box-shadow:-20px 0 40px rgba(0,0,0,.25)}
.pill{background:var(--pink);border:2px solid var(--ink);border-radius:22px;padding:14px 28px;font-size:clamp(26px,5vw,40px);text-align:center;max-width:min(92vw,720px);line-height:1.15}
.pic{max-height:36vh;max-width:min(80vw,320px);height:auto;border-radius:6px;display:block}
.row{display:flex;gap:clamp(16px,6vw,90px);justify-content:center;width:100%;max-width:760px}
.btn{font:inherit;font-size:clamp(20px,3.6vw,26px);background:var(--pink);color:var(--ink);border:2px solid var(--ink);border-radius:999px;min-width:150px;max-width:44vw;padding:14px 22px;cursor:pointer;line-height:1.15;transition:transform .15s,background .2s}
.btn:hover,.btn:focus-visible{background:#c4aef2;transform:scale(1.05);outline:none}
.btn:focus-visible{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.cover{flex-direction:row;gap:5vw;flex-wrap:wrap}
.star{position:relative;width:min(44vw,420px);aspect-ratio:1;display:grid;place-items:center;
background:repeating-conic-gradient(from 0deg,#f0a9b6 0 10deg,#f7d5da 10deg 20deg);clip-path:polygon(50% 0,60% 35%,100% 30%,68% 55%,85% 95%,50% 72%,15% 95%,32% 55%,0 30%,40% 35%)}
.circ{width:44%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:4px solid #fff}
.tag{position:absolute;left:4vw;top:18vh;transform:rotate(-30deg);background:#c9b6f2;padding:4px 12px;font-size:24px;border-radius:10px;font-weight:700;z-index:2}
.letter{background:var(--paper);width:min(92vw,420px);padding:28px 26px;font-size:clamp(17px,2.6vw,21px);line-height:1.35;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18);position:relative}
.letter::before,.letter::after{content:"";position:absolute;width:90px;height:26px;background:rgba(200,200,205,.75);transform:rotate(-35deg)}
.letter::before{left:-30px;top:-6px}.letter::after{right:-30px;bottom:-4px}
.hint{font-size:20px;opacity:.7}
.big{font-size:clamp(34px,8vw,64px);text-align:center;margin:0}
@media (max-width:760px){.cover{flex-direction:column;gap:12px;overflow-y:auto;justify-content:flex-start;padding-top:24px}}
@media (prefers-reduced-motion:reduce){.page{transition:opacity .4s}.page.flipped{transform:none;opacity:0;pointer-events:none}}
#no13{touch-action:none}
</style></head><body><div class="book" id="book"></div>

let noClicks=0,dodges=0;
function notify(i,title){if(!NOTIFY.key)return;
 fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
 body:JSON.stringify({access_key:NOTIFY.key,subject:'She forgave you! 💖',from_name:'Sorry website',
 message:`She clicked the forgive button on page ${i+1} of ${PAGES.length}: "${title}"\nTimes she clicked No: ${noClicks}\nTimes she tried to catch the runaway No: ${dodges}\nTime: ${new Date().toLocaleString()}`})}).catch(()=>{})}
const END={t:"Yayyy! Forgiven 💖",sub:"Thank you for forgiving me."};
/* f: = cute message shown at the end if she forgives on that page. Left button = forgive (jumps to the end), right button = next page. */
/* ==================================================================== */
const book=document.getElementById('book');const el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const total=PAGES.length+2;const pages=[];
function mk(html,cls){const p=el(`<section class="page ${cls||''}">${html}</section>`);p.style.zIndex=total-pages.length;book.appendChild(p);pages.push(p);return p}
const cover=mk(`<div><span class="tag" style="position:static;display:inline-block;transform:rotate(-4deg);margin-bottom:14px">${COVER.tag}</span><div class="letter">${COVER.text.map(t=>`<p style="margin:0 0 .7em">${t}</p>`).join('')}</div><p class="hint" style="text-align:center;margin:14px 0 0"><button class="btn" id="open">Open ✉️</button></p></div>`,'cover');
let idx=0;
function turn(){if(idx>=pages.length-1)return;pages[idx].classList.add('flipped');pages[idx].setAttribute('aria-hidden','true');idx++;
 const f=pages[idx].querySelector('.btn');if(f&&!pages[idx].dataset.last)setTimeout(()=>f.focus({preventScroll:true}),700)}
cover.querySelector('#open').onclick=turn;
function forgive(m,i,title){notify(i,title);if(m)document.getElementById('endsub').textContent=m;
 for(let i=idx;i<pages.length-1;i++){pages[i].style.transitionDelay=(i-idx)*0.12+'s';pages[i].classList.add('flipped');pages[i].setAttribute('aria-hidden','true')}
 idx=pages.length-1}
PAGES.forEach(p=>{
 const pg=mk(`<h1 class="pill" style="margin:0;font-weight:400">${p.t}</h1><img class="pic" src="${IMG[p.img]}" alt="">
 <div class="row"><button class="btn" data-y>${p.yes}</button><button class="btn" data-n ${p.last?'id="no13"':''}>${p.no}</button></div>`);
 if(p.last)pg.dataset.last=1;
 pg.querySelector('[data-y]').onclick=()=>forgive(p.f,PAGES.indexOf(p),p.t);
 if(!p.last)pg.querySelector('[data-n]').onclick=()=>{noClicks++;turn()};
});
mk(`<h1 class="big">${END.t}</h1><p class="pill" id="endsub" style="font-size:clamp(20px,4vw,28px)">${END.sub}</p>${NOTIFY.wa?`<a class="btn" style="text-decoration:none" href="https://wa.me/${NOTIFY.wa}?text=${encodeURIComponent('I forgive you 💖')}">Tell him 💌</a>`:''}`);
/* runaway No button on the last page */
const no=document.getElementById('no13'),yes=pages[pages.length-2].querySelector('[data-y]');
function dodge(e){dodges++;if(e){e.preventDefault&&e.preventDefault();e.stopPropagation&&e.stopPropagation()}
 no.style.position='fixed';const w=no.offsetWidth,h=no.offsetHeight,vw=innerWidth,vh=innerHeight,y=yes.getBoundingClientRect(),o=no.getBoundingClientRect();
 let best=null;for(let i=0;i<40;i++){const x=8+Math.random()*(vw-w-16),t=8+Math.random()*(vh-h-16);
  const hitYes=x<y.right+20&&x+w>y.left-20&&t<y.bottom+20&&t+h>y.top-20;
  const far=Math.hypot(x-o.left,t-o.top)>Math.min(160,vw/3);
  if(!hitYes&&far){best=[x,t];break}}
 if(!best)best=[vw-w-12,12];no.style.left=best[0]+'px';no.style.top=best[1]+'px';no.style.margin=0}
['pointerenter','pointerdown','touchstart','mousedown','click','focus'].forEach(ev=>no.addEventListener(ev,dodge,{passive:false}));
addEventListener('resize',()=>{if(no.style.position==='fixed'){const r=no.getBoundingClientRect();no.style.left=Math.max(8,Math.min(r.left,innerWidth-r.width-8))+'px';no.style.top=Math.max(8,Math.min(r.top,innerHeight-r.height-8))+'px'}});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&idx===0)turn()});
</script></body></html>
